<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AppActor Example</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
      }
      input,
      button {
        font-size: 16px;
        margin: 4px 0;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      }
      pre {
        background: #f3f3f3;
        font-size: 12px;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>AppActor</h1>
    <input id="api-key" placeholder="Public API key (pk_…)" autocapitalize="off" autocomplete="off" />
    <button id="configure">Configure</button>
    <button id="offerings">Get offerings</button>
    <button id="purchase">Buy the first package of the current offering</button>
    <button id="restore">Restore purchases</button>
    <button id="customer">Get customer info</button>
    <pre id="output"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
